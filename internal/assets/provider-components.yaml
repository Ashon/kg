  namespace: kgenesis-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgenesis-controller-manager
  namespace: kgenesis-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-kgenesis
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: infrastructure-kgenesis
      control-plane: controller-manager
  template:
    metadata:
      labels:
        cluster.x-k8s.io/provider: infrastructure-kgenesis
        control-plane: controller-manager
    spec:
      serviceAccountName: kgenesis-manager
      terminationGracePeriodSeconds: 10
      # The manager reaches the hosts over SSH, so it has to run somewhere with
      # routes to them. On the genesis node that is the kind node itself.
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      containers:
      - name: manager
        image: ghcr.io/ashon/kgenesis:dev
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:9440
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9440
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9440
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
