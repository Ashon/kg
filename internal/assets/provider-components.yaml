    cluster.x-k8s.io/provider: infrastructure-kgenesis
    control-plane: controller-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kgenesis-manager
  namespace: kgenesis-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-kgenesis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kgenesis-manager-rolebinding
  labels:
    cluster.x-k8s.io/provider: infrastructure-kgenesis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kgenesis-manager-role
subjects:
- kind: ServiceAccount
  name: kgenesis-manager
  namespace: kgenesis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kgenesis-leader-election-role
  namespace: kgenesis-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-kgenesis
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
