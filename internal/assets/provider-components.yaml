- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kgenesis-leader-election-rolebinding
  namespace: kgenesis-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-kgenesis
roleRef:
  apiGroup: rbac.authorization.k8s.io
