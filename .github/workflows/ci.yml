name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./api ./cmd ./internal)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files need gofmt:"
            echo "${unformatted}"
            gofmt -d ./api ./cmd ./internal
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: make build

      - name: Check the SPDX headers
        run: ./hack/license-headers.sh

      # The CRDs, RBAC and the provider manifest embedded in the CLI are
      # generated. A stale copy would install the wrong thing on a genesis node,
      # and the mismatch would only show up at `kg init`.
      - name: Check generated files are current
        run: make verify

  image:
    name: Build the provider image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/ashon/kg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
