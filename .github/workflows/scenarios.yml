name: Scenarios

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The scenarios build real clusters, so they also catch drift in the
    # upstream images they pull even when nothing here changed.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      node_image:
        description: kindest/node image the host containers are built from
        required: false
        default: kindest/node:v1.33.1

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  containers:
    name: Scenarios on container hosts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0

      # The bootstrap script loads these on each host. On a real machine they
      # are usually present already; a runner needs them asked for.
      - name: Load the kernel modules the hosts need
        run: |
          sudo modprobe br_netfilter
          sudo modprobe overlay
          lsmod | grep -E '^(br_netfilter|overlay)' || true

      # A bootstrap cluster plus one systemd container per host exhausts the
      # default inotify budget. kube-proxy then dies with "too many open files"
      # and nothing in the cluster can reach the API server.
      - name: Raise the inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=1048576

      # /proc/swaps is not namespaced, so a container playing the part of a host
      # sees the runner's swapfile and kubelet refuses to start. kg cannot
      # turn that off from inside: the swapfile is not in the container's mount
      # namespace. On a real machine it is, and the bootstrap handles it there.
      - name: Disable swap on the runner
        run: |
          sudo swapoff -a
          cat /proc/swaps

      - name: Run the scenarios
        env:
          DRIVER: docker
          NODE_IMAGE: ${{ inputs.node_image || 'kindest/node:v1.33.1' }}
          K8S_MINOR: "1.33"
          TIMEOUT: 25m
        run: ./test/scenarios/run.sh

      # The harness collects diagnostics itself, before it tears the containers
      # down. A step here would only ever see an empty docker ps.
