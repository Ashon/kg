name: Release

# A tag is what cuts a release. The tag name is the version: it goes into the
# binaries, into the container image, and into the manifest those binaries
# install, so the three can never disagree about which release they are.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for a dry run that publishes nothing
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Work out the version
        id: version
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A release that does not build or pass its own tests is not a release.
      - name: Check
        run: |
          make verify
          make test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The provider runs on whatever the cluster's own machines are, which is
      # not necessarily what this runner is.
      - name: Build the controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/ashon/kgenesis:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          provenance: false

      - name: Build the release artifacts
        run: ./hack/release.sh "${{ steps.version.outputs.version }}"

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$(mktemp)"
          # The tag before this one, so the notes can say what is in the release
          # rather than only how to install it.
          previous="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          {
            if [ -n "${previous}" ]; then
              printf '## Changes since %s\n\n' "${previous}"
              git log --no-merges --format='- %s' "${previous}..${VERSION}"
              printf '\n'
            fi
            printf 'Install the CLI:\n\n'
            printf '```console\n'
            printf 'os=$(uname -s | tr A-Z a-z)\n'
            printf 'arch=$(uname -m | sed -e s/x86_64/amd64/ -e s/aarch64/arm64/)\n'
            printf 'tar -xzf kgenesis_%s_${os}_${arch}.tar.gz\n' "${{ steps.version.outputs.version }}"
            printf 'sudo install kgenesis_*/kgenesis /usr/local/bin/\n'
            printf 'sudo ln -sf kgenesis /usr/local/bin/kg\n'
            printf '```\n\n'
            printf 'The controller image is `ghcr.io/ashon/kgenesis:%s`, which is what `kg init`\n' \
              "${{ steps.version.outputs.version }}"
            printf 'installs. `kg version` reports it, which is the first thing to check when the\n'
            printf 'controller will not start.\n\n'
            printf 'The hosts need a container runtime, kubeadm, kubelet and kubectl already on\n'
            printf 'them; `kg inventory check` reports what is missing. kgenesis does not bundle a\n'
            printf 'CNI, so name one under `cluster.cni.manifests` or the nodes stay NotReady.\n\n'
            printf '`provider-components.yaml` is the manifest that CLI has embedded, for reading\n'
            printf 'it without one.\n'
          } > "${notes}"

          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file "${notes}" \
            --prerelease="${{ contains(steps.version.outputs.version, '-') }}" \
            dist/*.tar.gz dist/provider-components.yaml dist/SHA256SUMS
