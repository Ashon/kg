name: Scenarios on machines

# VM coverage includes self-management and upgrades, which containers skip.
# Run it on relevant pull requests and main pushes as well as nightly.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'test/scenarios/**'
      - 'test/assets/**'
      - 'go.*'
      - 'Dockerfile'
      - 'Makefile'
      - 'hack/**'
      - '.github/workflows/scenarios-machines.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'test/scenarios/**'
      - 'test/assets/**'
      - 'go.*'
      - 'Dockerfile'
      - 'Makefile'
      - 'hack/**'
      - '.github/workflows/scenarios-machines.yml'
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: scenarios-machines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  machines:
    name: Scenarios on virtual machines
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0

      # /dev/kvm is there on a Linux runner but owned by the kvm group, so
      # without this the machines would be emulated and the run would never
      # finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install libvirt
        run: |
          sudo apt-get update -qq
          # dnsmasq-base is what libvirt hands a NAT network's addresses out
          # with; without it the network defines and refuses to start.
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 libvirt-daemon-system libvirt-clients virtinst qemu-utils \
            dnsmasq-base
          sudo systemctl enable --now libvirtd
          sudo usermod -aG libvirt,kvm "$USER"
          sudo virsh net-list --all

      # The bootstrap cluster is still a kind cluster in Docker, and it needs
      # the same room the container fleet does.
      - name: Raise the inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=1048576

      # /mnt is the runner's large ephemeral disk. A base image and an overlay
      # per machine do not fit on the root filesystem.
      - name: Make room for the machine images
        run: |
          sudo install -d -m 0755 /mnt/kg-images
          df -h / /mnt

      - name: Run the scenarios
        env:
          KG_SCENARIO_REPORT_DIR: ${{ github.workspace }}/.artifacts/e2e/libvirt
          DRIVER: libvirt
          # The fleet starts a minor below what the upgrade case rolls it to;
          # the driver picks both, so they stay together.
          TIMEOUT: 40m
        # sg runs the step with the new group membership, which the shell this
        # step starts in does not have yet.
        run: sg libvirt -c "sg kvm -c './test/scenarios/run.sh'"

      - name: Publish scenario summary
        if: always()
        shell: bash
        run: |
          report=".artifacts/e2e/libvirt/results.tsv"
          if [[ -f "${report}" ]]; then
            {
              echo '### E2E scenarios (libvirt)'
              echo '| Scenario | Result | Seconds |'
              echo '| --- | --- | --- |'
              awk -F '\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' "${report}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-libvirt-${{ github.run_attempt }}
          path: .artifacts/e2e/libvirt/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
