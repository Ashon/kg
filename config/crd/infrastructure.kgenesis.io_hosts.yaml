---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    cluster.x-k8s.io/provider: infrastructure-kgenesis
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/move: ""
  name: hosts.infrastructure.kgenesis.io
spec:
  group: infrastructure.kgenesis.io
  names:
    categories:
    - cluster-api
    kind: Host
    listKind: HostList
    plural: hosts
    shortNames:
    - hst
    singular: host
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.claimRef.name
      name: Claimed By
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Host is one pre-provisioned physical or virtual machine in the
          pool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HostSpec describes how to reach a pre-provisioned machine.
            properties:
              address:
                description: |-
                  address is the IP address or DNS name kg connects to over SSH. It is
                  also used as the node's advertised address unless the bootstrap data
                  overrides it.
                minLength: 1
                type: string
              hostKeyPolicy:
                default: TOFU
                description: hostKeyPolicy selects how the SSH host key is verified.
                enum:
                - Strict
                - TOFU
                - Insecure
                type: string
              port:
                default: 22
                description: port is the SSH port.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              publicKey:
                description: |-
                  publicKey is the expected SSH host key in authorized_keys format. Required
                  when hostKeyPolicy is Strict.
                type: string
              sshSecretRef:
                description: |-
                  sshSecretRef references a Secret in the same namespace holding the SSH
                  credentials. Recognised keys: "private_key" (PEM), "passphrase" (optional,
                  for an encrypted key) and "password" (used when no private key is given).
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              unhealthy:
                description: |-
                  unhealthy takes the Host out of the pool without deleting it. Existing
                  claims are left alone.
                type: boolean
              user:
                description: user is the SSH login user. It must be root or hold passwordless
                  sudo.
                minLength: 1
                type: string
            required:
            - address
            - sshSecretRef
            - user
            type: object
          status:
            description: HostStatus reports the observed state of a Host.
            properties:
              claimRef:
                description: claimRef points at the HostMachine currently holding
                  this Host.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              conditions:
                description: conditions holds the Reachable condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastProbeTime:
                description: lastProbeTime is when the SSH probe last ran.
                format: date-time
                type: string
              observedPublicKey:
                description: observedPublicKey is the host key pinned by the TOFU
                  policy.
                type: string
              phase:
                description: phase is a one-word summary for humans and for `kg inventory
                  list`.
                type: string
              systemInfo:
                description: systemInfo is what the last successful probe reported.
                properties:
                  architecture:
                    type: string
                  containerRuntime:
                    type: string
                  cpuCores:
                    format: int32
                    type: integer
                  hostname:
                    type: string
                  kernelVersion:
                    type: string
                  memoryMB:
                    format: int64
                    type: integer
                  osImage:
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
